limit_req_zone $binary_remote_addr zone=trianglehk_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name trianglehk.com www.trianglehk.com;
    return 301 https://trianglehk.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.trianglehk.com;

    ssl_certificate /etc/letsencrypt/live/trianglehk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trianglehk.com/privkey.pem;
    return 301 https://trianglehk.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trianglehk.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/trianglehk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trianglehk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TriangleTLS:10m;
    ssl_session_tickets off;

    client_max_body_size 10m;

    location /api/ {
        limit_req zone=trianglehk_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
