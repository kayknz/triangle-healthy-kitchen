    <script>
      window.onerror = function(msg, url, line, col, error) {
        var errDiv = document.getElementById('debug-error');

          errDiv.style.position = 'fixed';
          errDiv.style.top = '0';

          errDiv.style.right = '0';

          errDiv.style.padding = '24px';
          errDiv.style.fontSize = '13px';
          errDiv.style.fontFamily = 'monospace';
          errDiv.style.overflow = 'auto';
          errDiv.style.wordBreak = 'break-all';
          document.body.appendChild(errDiv);
        }
        errDiv.innerHTML += '<h3 style="color:#ff4d4d;margin-top:0">LAUNCH ERROR:</h3><p><b>' + msg + '</b></p><p>URL: ' + url + '<br>Line: ' + line + ':' + col + '</p><pre style="background:#2b0000;padding:10px;border-radius:6px;overflow:auto">' + (error && error.stack ? error.stack : 'No stack trace') + '</pre><hr style="border-color:#440000">';
      };
      window.onunhandledrejection = function(event) {
        var err = event.reason;
        var msg = err ? (err.message || err.toString()) : 'Unhandled Promise Rejection';
        window.onerror(msg, '', 0, 0, err);
      };
